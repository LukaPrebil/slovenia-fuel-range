name: ci

on:
  # A pull request already runs these checks, so a branch push needs no second run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks only read the repository; the default token can write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full history to walk the branch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: npm run check
      - run: npm run test
      - run: npm run validate:data -- --max-size
      - run: npm run build
