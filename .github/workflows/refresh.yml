name: refresh

on:
  schedule:
    # Regulated fuel prices change on Tuesdays and are published the day before.
    - cron: '10 5 * * 1'
    # The ARSO consumption list is a monthly edition.
    - cron: '20 5 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'fuel, catalogue or all'
        default: 'all'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Refresh data
        run: |
          if [ "${{ github.event.schedule }}" = "20 5 1 * *" ] || [ "${{ inputs.target }}" = "all" ]; then
            node scripts/build-data.ts
          else
            node scripts/build-data.ts --fuel-only
          fi

      - run: npm run validate:data -- --max-size
      - run: npm run test

      - name: Commit when the numbers moved
        run: |
          if git diff --quiet -- data; then
            echo "nothing changed upstream"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh prices and catalogue"
          git push
